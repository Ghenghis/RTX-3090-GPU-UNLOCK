# Quality gates for tooling, docs, integrity and secrets.
#
# Scope note: this workflow deliberately does NOT build, compile, or publish the
# unlock EFI payload. It validates the Python/PowerShell tooling, documentation,
# source-manifest integrity, and checks for leaked secrets. Hardware/firmware
# builds stay local and operator-driven.
#
# Action versions are pinned to release tags; pinning to full commit SHAs is a
# recommended follow-up hardening step.

name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: python -m pip install --upgrade "ruff==0.6.9" "mypy==1.11.2"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .
      - name: Mypy (tooling only)
        run: mypy scripts tools --ignore-missing-imports || true
        # mypy starts advisory (|| true) and becomes blocking once tooling is annotated.

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade "pytest==8.3.3"
      - name: Run tooling tests
        # Runs the host-side Python tests only; these do not touch hardware.
        run: pytest -q --maxfail=1 || ([ $? -eq 5 ] && echo "no tests collected yet" || exit 1)

  powershell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -RequiredVersion 1.22.0
      - name: Analyze
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error
          $issues | Format-Table -AutoSize
          if ($issues | Where-Object Severity -in 'Error','Warning') {
            Write-Error "PSScriptAnalyzer found $($issues.Count) issue(s)."
            exit 1
          }

  manifest-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify SOURCE-MANIFEST.json
        # Non-blocking until the manifest is regenerated for the current tree,
        # then flip continue-on-error to false to make drift fail the build.
        continue-on-error: true
        run: python -I scripts/verify_manifest.py --strict

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repo-relative links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --offline --include-fragments
            "**/*.md"
          fail: true
